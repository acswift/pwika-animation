<g id="content">
	<text transform="matrix(1 0 0 1 318 173.8215)" class="st1 st2 st3">https://www.makeswift.com/company</text>
	<rect x="318" y="198" class="st4" width="575" height="275"/>
	<text transform="matrix(1 0 0 1 318 209.3999)"><tspan x="0" y="0" class="st1 st2 st5">Svija came about because I used to build websites in Flash using Adobe Illustrator.</tspan><tspan x="0" y="36" class="st1 st2 st5">The last real website I built in Flash was in 2005. After that I was working on a big </tspan><tspan x="0" y="60" class="st1 st2 st5">programming job and didn’t need a good site of my own.</tspan><tspan x="278.253" y="96" class="st1 st2 st5">· · ·</tspan><tspan x="0" y="132" class="st1 st2 st5">Fast forward to 2014, when I needed to look for clients and wanted to build the best </tspan><tspan x="0" y="156" class="st1 st2 st5">site I possibly could.</tspan><tspan x="0" y="192" class="st1 st2 st5">Having built sites in Adobe Illustrator for Flash, I was used to being able to do </tspan><tspan x="0" y="216" class="st1 st2 st5">anything… vectors, animation, etc.</tspan><tspan x="0" y="252" class="st1 st2 st5">But in 2014, Flash was almost dead.</tspan></text>
	<rect x="502" y="516" class="st4" width="447" height="362.6"/>
	<text transform="matrix(1 0 0 1 502 527.3999)"><tspan x="0" y="0" class="st1 st2 st5">I just hated the idea of trying to build a serious website in HTML.</tspan><tspan x="0" y="36" class="st1 st2 st5">HTML is fundamentally suited to displaying text documents. </tspan><tspan x="0" y="60" class="st1 st2 st5">Everything else is tacked on.</tspan><tspan x="0" y="96" class="st1 st2 st5">Building a website with HTML feels like trying to build a bicycle </tspan><tspan x="0" y="120" class="st1 st2 st5">with Lego — it&apos;s possible, but you spend a lot of time putting </tspan><tspan x="0" y="144" class="st1 st2 st5">pieces together.</tspan><tspan x="0" y="180" class="st1 st2 st5">Things that were trivially easy in Adobe Illustrator in 1993  </tspan><tspan x="0" y="204" class="st1 st2 st5">(I started with Version 5) are still difficult or impossible in HTML, </tspan><tspan x="0" y="228" class="st1 st2 st5">even in 2022.</tspan><tspan x="0" y="264" class="st1 st2 st5">SVG seemed like the main alternative. It was the closest to what I </tspan><tspan x="0" y="288" class="st1 st2 st5">had been doing in Flash and was supported by all major browsers.</tspan></text>
	<rect x="502" y="1158" class="st4" width="447" height="111.223"/>
	<text transform="matrix(1 0 0 1 502 1169.3999)"><tspan x="0" y="0" class="st1 st2 st5">After building a few sites with multiple SVG images, it turned out to </tspan><tspan x="0" y="24" class="st1 st2 st5">be easier just to build the whole page as a single SVG.</tspan><tspan x="0" y="60" class="st1 st2 st5">That is Svija.</tspan><tspan x="0" y="96" class="st1 st6 st5">— Andy Swift, founder</tspan></text>
	<rect x="206.869" y="870" class="st4" width="538.131" height="243.436"/>
	<text transform="matrix(1 0 0 1 206.8691 881.3999)"><tspan x="0" y="0" class="st1 st2 st5">Coincidentally, Adobe Illustrator has excellent support for SVG.</tspan><tspan x="0" y="36" class="st1 st2 st5">At first, I just built HTML pages with big SVG images included as images or </tspan><tspan x="0" y="60" class="st1 st2 st5">objects. There were problems:</tspan><tspan x="30" y="96" class="st1 st2 st5">• When SVG is used in an &lt;img&gt; tag, Webkit-based browsers don’t display </tspan><tspan x="40" y="120" class="st1 st2 st5">embedded JPG images.</tspan><tspan x="30" y="144" class="st1 st2 st5">• When SVG is used in an &lt;object&gt; tag, all communication is cut off with the </tspan><tspan x="40" y="168" class="st1 st2 st5">rest of the page, o no interactivity..</tspan><tspan x="0" y="204" class="st1 st2 st5">The easiest way to use SVG turned out to be including the SVG code directly in </tspan><tspan x="0" y="228" class="st1 st2 st5">the web page, in an &lt;svg&gt; tag.</tspan></text>
	<rect x="176.116" y="1510.708" class="st4" width="929.659" height="580.668"/>
	<text id="content_cp_00000020380284667064377510000009117781340380948406_" transform="matrix(1 0 0 1 176.1163 1528.9475)"><tspan x="0" y="0" class="st7 st8 st9">History</tspan><tspan x="0" y="36.4" class="st1 st8 st10">Andrew Swift and Anaÿs</tspan><tspan x="0" y="65.4" class="st11 st2 st12">Svija is the creation of </tspan><tspan x="120.188" y="65.4" class="st11 st8 st12">Andrew Swift</tspan><tspan x="197.039" y="65.4" class="st11 st2 st12">, an American designer and developer who has lived in France since 2000 (Toulouse). </tspan><tspan x="0" y="84.4" class="st11 st2 st12">From 2002-2008 Swift developed </tspan><tspan x="181.43" y="84.4" class="st13 st2 st12">Anaÿs≈</tspan><tspan x="220.014" y="84.4" class="st11 st2 st12">, a tool that enabled the construction of indexable and user-modifiable websites in </tspan><tspan x="0" y="103.4" class="st13 st2 st12">Flash</tspan><tspan x="27.762" y="103.4" class="st11 st2 st12">, based on Adobe Illustrator files.</tspan><tspan x="0" y="130.4" class="st11 st2 st12">After the sale of his business in 2010, Swift left the field of technology, planning to become a full-time fine artist. In 2014, </tspan><tspan x="0" y="149.4" class="st11 st2 st12">realizing that a career in fine art would be difficult to achieve, he decided to return to web-based graphic design.</tspan><tspan x="0" y="181.8" class="st1 st8 st10">The end of Flash</tspan><tspan x="0" y="210.8" class="st11 st2 st12">With the advent of the </tspan><tspan x="122.789" y="210.8" class="st13 st2 st12">iPhone</tspan><tspan x="160.295" y="210.8" class="st11 st2 st12"> and the increased importance of the mobile web, Flash was no longer an option. The creation </tspan><tspan x="0" y="229.8" class="st11 st2 st12">of websites had come to be dominated by site-building tools like </tspan><tspan x="348.234" y="229.8" class="st13 st2 st12">Wordpress</tspan><tspan x="407.361" y="229.8" class="st11 st2 st12">, </tspan><tspan x="413.057" y="229.8" class="st13 st2 st12">Wix</tspan><tspan x="432.451" y="229.8" class="st11 st2 st12">, </tspan><tspan x="438.146" y="229.8" class="st13 st2 st12">Weebly</tspan><tspan x="477.387" y="229.8" class="st11 st2 st12"> and </tspan><tspan x="504.199" y="229.8" class="st13 st2 st12">Squarespace</tspan><tspan x="573.949" y="229.8" class="st11 st2 st12">.</tspan><tspan x="0" y="256.8" class="st11 st2 st12">Swift, refusing to accept working with HTML, started looking for a </tspan><tspan x="349.998" y="256.8" class="st13 st2 st12">vector</tspan><tspan x="383.514" y="256.8" class="st11 st2 st12">-based solution. It quickly became apparent that </tspan><tspan x="0" y="275.8" class="st11 st2 st12">there were only two widely-supported alternatives: the </tspan><tspan x="295.676" y="275.8" class="st13 st2 st12">HTML 5 Canvas element</tspan><tspan x="425.812" y="275.8" class="st11 st2 st12"> and the </tspan><tspan x="473.426" y="275.8" class="st13 st2 st12">SVG</tspan><tspan x="495.568" y="275.8" class="st11 st2 st12"> image format. SVG was chosen </tspan><tspan x="0" y="294.8" class="st11 st2 st12">because it permitted search-engine indexable text.</tspan><tspan x="0" y="321.8" class="st11 st2 st12">Initially it was unclear whether the SVG format would be sufficiently stable for building websites. Swift encountered various </tspan><tspan x="0" y="340.8" class="st11 st2 st12">problems including: linked images would occasionally fail to appear, SVG content would be displayed at different sizes in </tspan><tspan x="0" y="359.8" class="st11 st2 st12">different browsers, and Apple&apos;s </tspan><tspan x="170.256" y="359.8" class="st13 st2 st12">Safari browser</tspan><tspan x="247.975" y="359.8" class="st11 st2 st12"> would resize SVG text erratically.</tspan><tspan x="0" y="386.8" class="st11 st2 st12">These and other issues were eventually resolved. The first few SVG-based websites were built by hand but over the course of </tspan><tspan x="0" y="405.8" class="st11 st2 st12">eighteen months in 2015-2016 the process was automated, and Svija was born.</tspan><tspan x="0" y="438.2" class="st1 st8 st10">Svija SAS</tspan><tspan x="0" y="467.2" class="st11 st2 st12">Beginning in 2017, Swift partnered with </tspan><tspan x="214.078" y="467.2" class="st13 st2 st12">web agencies</tspan><tspan x="286.488" y="467.2" class="st11 st2 st12"> One Cut Studio and Agence Takotak on several Svija-based websites. In 2019, Jean-Philippe Juan and Badre Akaaboune, </tspan><tspan x="0" y="486.2" class="st11 st2 st12">heads of their respective agencies, proposed a partnership in order to commercialize Svija.</tspan><tspan x="0" y="513.2" class="st11 st2 st12">Initially, the intention was to seek funding directly before commercializing the program. However, it quickly became clear that raising funding would depend on being able to </tspan><tspan x="0" y="532.2" class="st11 st2 st12">show an interested and growing user base.</tspan><tspan x="0" y="559.2" class="st11 st2 st12">Since January 2020, efforts have been concentrated on distributing a beta version of the Svija software. Svija SAS was officially created in September, 2020.</tspan></text>
	<rect id="picture_wrap_cp" x="851.755" y="1548.593" class="st0" width="267.939" height="380.405"/>

			<text id="Texte-qui-suije-je_00000115473851401482768060000003231910687136519586_" transform="matrix(1 0 0 1 1219.5978 123.1689)"><tspan x="0" y="0" style="fill:#A0A0A0; font-family:'FuturaPT-Light'; font-size:16px;">Le bouquet de fleurs d&apos;un fleuriste est un asse</tspan><tspan x="277.272" y="0" style="fill:#A0A0A0; font-family:'FuturaPT-Light'; font-size:16px;">-</tspan><tspan x="0" y="19.2" style="fill:#A0A0A0; font-family:'FuturaPT-Light'; font-size:16px;">blage artistique de différentes variétés de fleurs et </tspan><tspan x="0" y="38.4" style="fill:#A0A0A0; font-family:'FuturaPT-Light'; font-size:16px;">de feuillages. Le fleuriste sélectionne des fleurs </tspan><tspan x="0" y="57.6" style="fill:#A0A0A0; font-family:'FuturaPT-Light'; font-size:16px;">fraîches et de qualité en fonction de leur couleur, de </tspan><tspan x="0" y="76.8" style="fill:#A0A0A0; font-family:'FuturaPT-Light'; font-size:16px;">leur texture et de leur taille pour créer un bouquet </tspan><tspan x="0" y="96" style="fill:#A0A0A0; font-family:'FuturaPT-Light'; font-size:16px;">harmonieux. Chaque bouquet est unique et peut </tspan><tspan x="0" y="115.2" style="fill:#A0A0A0; font-family:'FuturaPT-Light'; font-size:16px;">être personnalisé selon les goûts et les besoins du </tspan></text>
		<text transform="matrix(1 0 0 1 1219.5975 87.8125)" style="fill:#FFFFFF; font-family:'FuturaPT-Light'; font-size:24px;">Cérémonie mars</text>
	</g>

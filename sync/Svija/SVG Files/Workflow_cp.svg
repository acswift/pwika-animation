	<g>
		<rect x="392" y="665.844" class="st10" width="407" height="154.635"/>
		<text transform="matrix(1 0 0 1 391.9999 677.244)"><tspan x="0" y="0" class="st1 st6 st9">Svija Sync</tspan><tspan x="70.473" y="0" class="st1 st2 st9"> is a Mac app that synchronizes your Illustrator </tspan><tspan x="0" y="24" class="st1 st2 st9">files with your website.</tspan><tspan x="0" y="57.6" class="st1 st2 st9">Each time you start a design session, you launch Svija Sync </tspan><tspan x="0" y="81.6" class="st1 st2 st9">and </tspan><tspan x="29.618" y="81.6" class="st1 st6 st9">press Upload</tspan><tspan x="124.444" y="81.6" class="st1 st2 st9">.</tspan><tspan x="0" y="115.2" class="st1 st6 st9">Synchronization continues</tspan><tspan x="191.798" y="115.2" class="st1 st2 st9"> until you press </tspan><tspan x="298.38" y="115.2" class="st1 st6 st9">Pause</tspan><tspan x="341.776" y="115.2" class="st1 st2 st9"> or quit </tspan><tspan x="0" y="139.2" class="st1 st2 st9">the program.</tspan></text>
	</g>

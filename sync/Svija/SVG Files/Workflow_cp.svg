	<g>
		<rect x="560" y="978.851" class="st10" width="407" height="169.036"/>
		<text transform="matrix(1 0 0 1 559.9999 990.2507)"><tspan x="0" y="0" class="st1 st2 st9">The pages are </tspan><tspan x="98.583" y="0" class="st1 st6 st9">designed normally in Adobe Illustrator</tspan><tspan x="376.565" y="0" class="st1 st2 st9">. </tspan><tspan x="0" y="24" class="st1 st2 st9">You can create mobile and desktop versions in a single </tspan><tspan x="0" y="48" class="st1 st2 st9">document, or separate them for simplicity.</tspan><tspan x="0" y="81.6" class="st1 st2 st9">All the main Illustrator tools are available for use in Svija </tspan><tspan x="0" y="105.6" class="st1 st2 st9">pages, but some recent additions that replicate Photoshop </tspan><tspan x="0" y="129.6" class="st1 st2 st9">functionality require simple workarounds to fit the SVG </tspan><tspan x="0" y="153.6" class="st1 st2 st9">standard.</tspan></text>
	</g>
	
		<image style="overflow:visible;" width="1488" height="1386" xlink:href="../../Links/home page.jpg"  transform="matrix(0.1842 0 0 0.1842 237.6452 937.0394)">
	</image>
	<text transform="matrix(1 0 0 1 374.2422 1047.3419)"><tspan x="0" y="0" class="st1 st6 st9">desktop </tspan><tspan x="2.483" y="24" class="st1 st6 st9">version</tspan></text>
	<text transform="matrix(1 0 0 1 352.0234 1169.3419)" class="st0 st6 st9">Illustrator file</text>
	<text transform="matrix(0 -1 1 0 279.3781 1126.8706)" class="st1 st6 st9">mobile version</text>
</g>
<g id="save">
	<g>
		<rect x="563.251" y="1324.81" class="st10" width="380.749" height="168.418"/>
		<text transform="matrix(1 0 0 1 563.251 1335.7543)"><tspan x="0" y="0" class="st1 st2 st14">When you&apos;re ready to save your document, </tspan><tspan x="280.674" y="0" class="st1 st6 st14">just press </tspan><tspan x="0" y="19.2" class="st1 st6 st14">Save</tspan><tspan x="32.273" y="19.2" class="st1 st2 st14"> — Svija Tools saves the Illustrator document and also </tspan><tspan x="0" y="38.4" class="st1 st2 st14">an SVG file in a special folder.</tspan><tspan x="0" y="67.2" class="st1 st2 st14">The SVG file is immediately </tspan><tspan x="176.542" y="67.2" class="st1 st6 st14">synchronized with your </tspan><tspan x="0" y="86.4" class="st1 st6 st14">website</tspan><tspan x="54.014" y="86.4" class="st1 st2 st14"> by Svija Sync.</tspan><tspan x="0" y="115.2" class="st1 st2 st14">Your page is instantly available online for review or </tspan><tspan x="0" y="134.4" class="st1 st2 st14">publication. If the design is done, the page is live with no </tspan><tspan x="0" y="153.6" class="st1 st2 st14">further work.</tspan></text>
	</g>
	<g>

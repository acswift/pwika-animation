		<text transform="matrix(1 0 0 1 560.3907 1637.2422)"><tspan x="0" y="0" class="st1 st6 st9">Svija Admin</tspan><tspan x="84.544" y="0" class="st1 st2 st9"> is a web interface to:</tspan><tspan x="0" y="33.6" class="st1 st2 st9">• choose the address of your web pages</tspan><tspan x="0" y="57.6" class="st1 st2 st9">• optimize for search engines</tspan><tspan x="0" y="81.6" class="st1 st2 st9">• mix and combine Illustrator files</tspan><tspan x="0" y="105.6" class="st1 st2 st9">• create custom headers, footers, and other reusable modules</tspan><tspan x="0" y="129.6" class="st1 st2 st9">• all placed to the pixel with incredible precision</tspan></text>

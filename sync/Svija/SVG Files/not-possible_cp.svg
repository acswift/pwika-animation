<g id="mid_text">
	<g>
		<rect x="378.495" y="1178.618" class="st13" width="332.603" height="124.45"/>
		<text transform="matrix(1 0 0 1 378.4936 1188.7546)"><tspan x="0" y="0" class="st14 st15 st19">The human desire for exploration is a deep </tspan><tspan x="0" y="20" class="st14 st15 st19">evolutionary trait that motivates us to learn new things, </tspan><tspan x="0" y="40" class="st14 st15 st19">meet new people and gain a deeper understanding of </tspan><tspan x="0" y="60" class="st14 st15 st19">our natural planet. </tspan><tspan x="0" y="90" class="st14 st15 st19">At Vinter Peabody we believe that play is essentially a </tspan><tspan x="0" y="110" class="st14 st15 st19">transformational experience that may be enjoyed at </tspan></text>
	</g>
	<g>
		<rect x="750.034" y="1178.618" class="st13" width="410.329" height="124.45"/>
		<text transform="matrix(1 0 0 1 750.0327 1188.7546)"><tspan x="0" y="0" class="st14 st15 st19">any age.  We believe that to play is to thrive and that every activity </tspan><tspan x="0" y="20" class="st14 st15 st19">should be an adventure. </tspan><tspan x="0" y="50" class="st14 st15 st19">Our mission is to help ordinary people learn to become most </tspan><tspan x="0" y="70" class="st14 st15 st19">extraordinary. With our portfolio of adventures, voyages and </tspan><tspan x="0" y="90" class="st14 st15 st19">escorted expeditions we have redefined the experience of play for </tspan><tspan x="0" y="110" class="st14 st15 st19">both individuals and groups, in safety and style.</tspan></text>
	</g>
</g>

<g id="header">
	<text transform="matrix(1 0 0 1 36.3848 62.8215)"><tspan x="0" y="0" class="st1 st2 st3">Examples of </tspan><tspan x="21.896" y="48.766" class="st1 st2 st3">Svija Sites</tspan></text>
	<rect x="28" y="139.276" class="st4" width="249" height="63.436"/>
	<text transform="matrix(1 0 0 1 28 150.6755)"><tspan x="0" y="0" class="st1 st2 st5">Many elements would be impossible </tspan><tspan x="0" y="24" class="st1 st2 st5">in HTML: curves, continuity, and rich, </tspan><tspan x="0" y="48" class="st1 st2 st5">precise imagery.</tspan></text>
	<line class="st6" x1="30" y1="228.5" x2="270" y2="228.5"/>

<g id="descriptions_MB">
	<g id="linkOzakeMO">
		<text transform="matrix(1 0 0 1 110.7524 276.8038)" class="st1 st7 st8">OZAKE.COM</text>
		<rect x="30" y="296.78" class="st4" width="239" height="234.407"/>
		<text transform="matrix(1 0 0 1 45 307.4199)"><tspan x="0" y="0" class="st1 st2 st9">Svija founder Andrew Swift&apos;s </tspan><tspan x="0" y="21" class="st1 st2 st9">design website. Probably the </tspan><tspan x="0" y="42" class="st1 st2 st9">most elaborate Svija website, it is </tspan><tspan x="0" y="63" class="st1 st2 st9">animated with Svija Vibe — check </tspan><tspan x="0" y="84" class="st1 st2 st9">out the subtle clouds, the </tspan><tspan x="0" y="105" class="st1 st2 st9">buttons, and make sure to </tspan><tspan x="0" y="126" class="st1 st2 st9">mouseover &quot;Antoine de St. </tspan><tspan x="0" y="147" class="st1 st2 st9">Exupery&quot; on the home page.</tspan><tspan x="0" y="178" class="st1 st2 st9">The aim was to exploit large, </tspan><tspan x="0" y="199" class="st1 st2 st9">high-quality images to show the </tspan><tspan x="0" y="220" class="st1 st2 st9">full capability of Svija. </tspan></text>
	</g>
	<g id="linkAntMO">
		<text transform="matrix(1 0 0 1 88.7329 992.1413)" class="st1 st7 st8">ANTRETOISE.SHOP</text>
		<g>
			<rect x="30" y="1011.118" class="st4" width="239" height="202.407"/>
			<text transform="matrix(1 0 0 1 45 1021.7575)"><tspan x="0" y="0" class="st1 st2 st9">Antretoise is a French knife maker </tspan><tspan x="0" y="21" class="st1 st2 st9">who needed a website that could </tspan><tspan x="0" y="42" class="st1 st2 st9">serve as a catalog.</tspan><tspan x="0" y="73" class="st1 st2 st9">Using Svija gave them the </tspan><tspan x="0" y="94" class="st1 st2 st9">possibility of creating unique </tspan><tspan x="0" y="115" class="st1 st2 st9">home and product pages with </tspan><tspan x="0" y="136" class="st1 st2 st9">high definition pictures.</tspan><tspan x="0" y="167" class="st1 st2 st9">We did all the photos and design </tspan><tspan x="0" y="188" class="st1 st2 st9">for this project in 2019. </tspan></text>
		</g>
	</g>
	<g id="linkSvjMO">
		<text transform="matrix(1 0 0 1 93.0054 1822.8789)" class="st1 st7 st8">2020.SVIJA.LOVE</text>
		<rect x="30" y="1842.855" class="st4" width="239" height="150.407"/>
		<text transform="matrix(1 0 0 1 45 1853.4951)"><tspan x="0" y="0" class="st1 st2 st9">The previous Svija website.</tspan><tspan x="0" y="31" class="st1 st2 st9">The idea was to display large </tspan><tspan x="0" y="52" class="st1 st2 st9">format images and show directly </tspan><tspan x="0" y="73" class="st1 st2 st9">from the home page the </tspan><tspan x="0" y="94" class="st1 st2 st9">capabilities of Svija using unique </tspan><tspan x="0" y="115" class="st1 st2 st9">shapes and sophisticated </tspan><tspan x="0" y="136" class="st1 st2 st9">background images.</tspan></text>
	</g>
	<g id="linkMnkMO">
		<text transform="matrix(1 0 0 1 118.1323 2454.6165)" class="st1 st7 st8">MANIK.FR</text>
		<rect x="30" y="2474.587" class="st4" width="239" height="150.406"/>
		<text transform="matrix(1 0 0 1 45 2485.2266)"><tspan x="0" y="0" class="st1 st2 st9">One of the first Svija sites, </tspan><tspan x="0" y="21" class="st1 st2 st9">manik.fr was a proof of concept </tspan><tspan x="0" y="42" class="st1 st2 st9">to show that we could provide a </tspan><tspan x="0" y="63" class="st1 st2 st9">high-quality online presence at an </tspan><tspan x="0" y="84" class="st1 st2 st9">affordable budget.</tspan><tspan x="0" y="115" class="st1 st2 st9">Six years later, the site is still </tspan><tspan x="0" y="136" class="st1 st2 st9">flourishing!</tspan></text>
	</g>
	<g id="linkOcsMO">
		<text transform="matrix(1 0 0 1 81.4727 3137.948)" class="st1 st7 st8">ONECUTSTUDIO.COM</text>
		<rect x="30" y="3157.918" class="st4" width="239" height="171.406"/>
		<text transform="matrix(1 0 0 1 45 3168.5581)"><tspan x="0" y="0" class="st1 st2 st9">OCS is a web and communication </tspan><tspan x="0" y="21" class="st1 st2 st9">agency. Their website is built to </tspan><tspan x="0" y="42" class="st1 st2 st9">look like a catalog, with </tspan><tspan x="0" y="63" class="st1 st2 st9">high-resolution images and </tspan><tspan x="0" y="84" class="st1 st2 st9">smooth visual effects.</tspan><tspan x="0" y="115" class="st1 st2 st9">In 2018, OCS became the first </tspan><tspan x="0" y="136" class="st1 st2 st9">agency to offer Svija websites </tspan><tspan x="0" y="157" class="st1 st2 st9">directly to customers. </tspan></text>
	</g>
	<g id="linkBckMO">
		<text transform="matrix(1 0 0 1 83.7412 7829.625)" class="st1 st7 st8">BECKETT.SVIJA.SITE</text>
		<rect x="30" y="7849.595" class="st4" width="239" height="171.406"/>
		<text transform="matrix(1 0 0 1 45 7860.2354)"><tspan x="0" y="0" class="st1 st2 st9">Le Beckett is a restaurant in Paris </tspan><tspan x="0" y="21" class="st1 st2 st9">that requested a landing page to </tspan><tspan x="0" y="42" class="st1 st2 st9">lead to a simple Wordpress </tspan><tspan x="0" y="63" class="st1 st2 st9">shopping site and a menu </tspan><tspan x="0" y="84" class="st1 st2 st9">maintained in Google Docs.</tspan><tspan x="0" y="115" class="st1 st2 st9">The page was built in a matter of </tspan><tspan x="0" y="136" class="st1 st2 st9">minutes from a PDF flyer </tspan><tspan x="0" y="157" class="st1 st2 st9">provided by the restaurant.</tspan></text>
	</g>
	<g id="linkOcpMO">
		<text transform="matrix(1 0 0 1 97.7441 10586.6465)" class="st1 st7 st8">OCSPRIME.COM</text>
		<g>
			<rect x="30" y="10606.511" class="st4" width="239" height="140.406"/>
			<text transform="matrix(1 0 0 1 45 10617.1514)"><tspan x="0" y="0" class="st1 st2 st9">OCS Prime was a service offered </tspan><tspan x="0" y="21" class="st1 st2 st9">by One Cut Studio providing </tspan><tspan x="0" y="42" class="st1 st2 st9">single-serving hybrid Svija and </tspan><tspan x="0" y="63" class="st1 st2 st9">e-commerce web pages for local </tspan><tspan x="0" y="84" class="st1 st2 st9">shops that wanted to add delivery </tspan><tspan x="0" y="105" class="st1 st2 st9">capabilities during the Covid-19 </tspan><tspan x="0" y="126" class="st1 st2 st9">pandemic.</tspan></text>
		</g>
	</g>
	<g id="linkCopMO">
		<text transform="matrix(1 0 0 1 73.9854 5987.8359)" class="st1 st7 st8">COLORPOP.SVIJA.LOVE</text>
		<rect x="30" y="6007.87" class="st4" width="239" height="108.406"/>
		<text transform="matrix(1 0 0 1 45 6018.5098)"><tspan x="0" y="0" class="st1 st2 st9">Colorpop was the result of a </tspan><tspan x="0" y="21" class="st1 st2 st9">design exercise by freelancer </tspan><tspan x="0" y="42" class="st1 st2 st9">Eman Akaaboune.</tspan><tspan x="0" y="73" class="st1 st2 st9">We love the rich colors and </tspan><tspan x="0" y="94" class="st1 st2 st9">modern forms!</tspan></text>
	</g>
	<g id="linkEmdMO">
		<text transform="matrix(1 0 0 1 90.9888 3847.8794)" class="st1 st7 st8">EMANADESIGN.FR</text>
		<rect x="30" y="3867.743" class="st4" width="239" height="129.406"/>
		<text transform="matrix(1 0 0 1 45 3878.3833)"><tspan x="0" y="0" class="st1 st2 st9">Freelancer Eman Akaaboune&apos;s </tspan><tspan x="0" y="21" class="st1 st2 st9">porfolio site, emanadesign.fr was </tspan><tspan x="0" y="42" class="st1 st2 st9">heavily inspired by ozake.com.</tspan><tspan x="0" y="73" class="st1 st2 st9">Svija enabled the use of </tspan><tspan x="0" y="94" class="st1 st2 st9">richly-detailed background </tspan><tspan x="0" y="115" class="st1 st2 st9">images and brilliant typography.</tspan></text>
	</g>
	<g id="linkAncMO">
		<text transform="matrix(1 0 0 1 101.4766 7276.8311)" class="st1 st7 st8">ANCOPRINT.FR</text>
		<rect x="30" y="7296.863" class="st4" width="239" height="129.406"/>
		<text transform="matrix(1 0 0 1 45 7307.5034)"><tspan x="0" y="0" class="st1 st2 st9">Ancoprint is a small print shop </tspan><tspan x="0" y="21" class="st1 st2 st9">near Lyon, France.</tspan><tspan x="0" y="52" class="st1 st2 st9">With Svija, they were able to </tspan><tspan x="0" y="73" class="st1 st2 st9">convert their existing brochure </tspan><tspan x="0" y="94" class="st1 st2 st9">into a nice little website in less </tspan><tspan x="0" y="115" class="st1 st2 st9">than two hours.</tspan></text>
	</g>
	<g id="linkStfMO">
		<text transform="matrix(1 0 0 1 105.9766 5014.104)" class="st1 st7 st8">STAFFEUR.FR</text>
		<rect x="30" y="5034.075" class="st4" width="239" height="150.407"/>
		<text transform="matrix(1 0 0 1 45 5044.7148)"><tspan x="0" y="0" class="st1 st2 st9">Another original Svija client, </tspan><tspan x="0" y="21" class="st1 st2 st9">Atelier Staffeur has received high </tspan><tspan x="0" y="42" class="st1 st2 st9">praise for their website for seven </tspan><tspan x="0" y="63" class="st1 st2 st9">years now.</tspan><tspan x="0" y="94" class="st1 st2 st9">The majestic images and </tspan><tspan x="0" y="115" class="st1 st2 st9">sweeping curves are only possible </tspan><tspan x="0" y="136" class="st1 st2 st9">with Svija.</tspan></text>
	</g>
	<g id="linkMasMO">
		<text transform="matrix(1 0 0 1 102.2324 8610.3555)" class="st1 st7 st8">MASTURI.ASIA</text>
		<rect x="30" y="8631.326" class="st4" width="239" height="234.406"/>
		<text transform="matrix(1 0 0 1 45 8641.9658)"><tspan x="0" y="0" class="st1 st2 st9">This Svija/Woocomerce website </tspan><tspan x="0" y="21" class="st1 st2 st9">was built to demonstrate how it is </tspan><tspan x="0" y="42" class="st1 st2 st9">possible to integrate ecommerce </tspan><tspan x="0" y="63" class="st1 st2 st9">into the Svija ecosystem.</tspan><tspan x="0" y="94" class="st1 st2 st9">Once finished, the user </tspan><tspan x="0" y="115" class="st1 st2 st9">experience will transition </tspan><tspan x="0" y="136" class="st1 st2 st9">seamlessly between the main, </tspan><tspan x="0" y="157" class="st1 st2 st9">Svija website and the </tspan><tspan x="0" y="178" class="st1 st2 st9">Woocommerce payment </tspan><tspan x="0" y="199" class="st1 st2 st9">processing website at </tspan><tspan x="0" y="220" class="st1 st2 st9">secure.masturi.asia.</tspan></text>
	</g>
</g>

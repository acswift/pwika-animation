<g id="mid_text">
	<g>
		<polygon class="st13" points="284,403 59,403 59,340 27.624,339.847 27.624,296.655 284,296.655 		"/>
		<text transform="matrix(1 0 0 1 27.6237 303.8945)"><tspan x="0" y="0" class="st14 st15 st19">The human desire for exploration is a deep evolutionary </tspan><tspan x="0" y="14" class="st14 st15 st19">trait that motivates us to learn new things, meet new people </tspan><tspan x="0" y="28" class="st14 st15 st19">and gain a deeper understanding of our natural planet. </tspan><tspan x="31.376" y="52" class="st14 st15 st19">At Vinter Peabody we believe that play is essentially </tspan><tspan x="31.376" y="66" class="st14 st15 st19">a transformational experience that may be enjoyed </tspan><tspan x="31.376" y="80" class="st14 st15 st19">at any age.  We believe that to play is to thrive and </tspan><tspan x="31.376" y="94" class="st14 st15 st19">that every activity should be an adventure. </tspan></text>
	</g>
	<g>
		<rect x="19.762" y="474.655" class="st13" width="268" height="106.345"/>
		<text transform="matrix(1 0 0 1 19.7621 481.8945)"><tspan x="0" y="0" class="st14 st15 st19">Our mission is to help ordinary people learn to become most </tspan><tspan x="0" y="14" class="st14 st15 st19">extraordinary. With our portfolio of adventures, voyages and </tspan><tspan x="0" y="28" class="st14 st15 st19">escorted expeditions we have redefined the experience of play </tspan><tspan x="0" y="42" class="st14 st15 st19">for both individuals and groups, in safety and style.</tspan></text>
	</g>
</g>

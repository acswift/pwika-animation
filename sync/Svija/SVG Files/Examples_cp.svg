		<text transform="matrix(1 0 0 1 393.4727 931)" class="st1 st8 st9">ONECUTSTUDIO.COM</text>
		<rect x="342" y="950.97" class="st10" width="239" height="171.406"/>
		<text transform="matrix(1 0 0 1 357 961.6102)"><tspan x="0" y="0" class="st1 st2 st11">OCS is a web and communication </tspan><tspan x="0" y="21" class="st1 st2 st11">agency. Their website is built to </tspan><tspan x="0" y="42" class="st1 st2 st11">look like a catalog, with </tspan><tspan x="0" y="63" class="st1 st2 st11">high-resolution images and </tspan><tspan x="0" y="84" class="st1 st2 st11">smooth visual effects.</tspan><tspan x="0" y="115" class="st1 st2 st11">In 2018, OCS became the first </tspan><tspan x="0" y="136" class="st1 st2 st11">agency to offer Svija websites </tspan><tspan x="0" y="157" class="st1 st2 st11">directly to customers. </tspan></text>
	</g>
	<g id="ovaway_x2F_Bck">
		<path class="st6" d="M302.5,1601h-235c-1.381,0-2.5-1.119-2.5-2.5v-495c0-1.381,1.119-2.5,2.5-2.5h235c1.381,0,2.5,1.119,2.5,2.5

		<path class="st7" d="M576,754.5H347c-2.761,0-5-2.239-5-5v-509c0-2.761,2.239-5,5-5h229c2.761,0,5,2.239,5,5v509
			C581,752.261,578.761,754.5,576,754.5z"/>
		<text transform="matrix(1 0 0 1 400.7329 398)" class="st1 st8 st9">ANTRETOISE.SHOP</text>
		<g>
			<rect x="342" y="416.976" class="st10" width="239" height="202.407"/>
			<text transform="matrix(1 0 0 1 357 427.6162)"><tspan x="0" y="0" class="st1 st2 st11">Antretoise is a French knife maker </tspan><tspan x="0" y="21" class="st1 st2 st11">who needed a website that could </tspan><tspan x="0" y="42" class="st1 st2 st11">serve as a catalog.</tspan><tspan x="0" y="73" class="st1 st2 st11">Using Svija gave them the </tspan><tspan x="0" y="94" class="st1 st2 st11">possibility of creating unique </tspan><tspan x="0" y="115" class="st1 st2 st11">home and product pages with </tspan><tspan x="0" y="136" class="st1 st2 st11">high definition pictures.</tspan><tspan x="0" y="167" class="st1 st2 st11">We did all the photos and design </tspan><tspan x="0" y="188" class="st1 st2 st11">for this project in 2019. </tspan></text>
		</g>
	</g>
	<g id="ovaway_x2F_Svj">
		<path class="st6" d="M856,607H621c-1.381,0-2.5-1.119-2.5-2.5v-367c0-1.381,1.119-2.5,2.5-2.5h235c1.381,0,2.5,1.119,2.5,2.5v367
			C858.5,605.881,857.381,607,856,607z"/>
		<path class="st7" d="M853,606.5H624c-2.761,0-5-2.239-5-5v-361c0-2.761,2.239-5,5-5h229c2.761,0,5,2.239,5,5v361

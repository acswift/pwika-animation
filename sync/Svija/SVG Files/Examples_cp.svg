			C304.5,2334.261,302.261,2336.5,299.5,2336.5z"/>
		<text transform="matrix(1 0 0 1 133.2441 1925)" class="st1 st8 st9">OCSPRIME.COM</text>
		<g>
			<rect x="65.5" y="1944.865" class="st10" width="239" height="140.406"/>
			<text transform="matrix(1 0 0 1 80.5 1955.5046)"><tspan x="0" y="0" class="st1 st2 st11">OCS Prime was a service offered </tspan><tspan x="0" y="21" class="st1 st2 st11">by One Cut Studio providing </tspan><tspan x="0" y="42" class="st1 st2 st11">single-serving hybrid Svija and </tspan><tspan x="0" y="63" class="st1 st2 st11">e-commerce web pages for local </tspan><tspan x="0" y="84" class="st1 st2 st11">shops that wanted to add delivery </tspan><tspan x="0" y="105" class="st1 st2 st11">capabilities during the Covid-19 </tspan><tspan x="0" y="126" class="st1 st2 st11">pandemic.</tspan></text>
		</g>
	</g>

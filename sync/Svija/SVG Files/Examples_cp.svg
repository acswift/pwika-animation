		<rect x="895.5" y="2138.032" class="st10" width="239" height="129.406"/>
		<text transform="matrix(1 0 0 1 910.5 2148.6724)"><tspan x="0" y="0" class="st1 st2 st11">Ancoprint is a small print shop </tspan><tspan x="0" y="21" class="st1 st2 st11">near Lyon, France.</tspan><tspan x="0" y="52" class="st1 st2 st11">With Svija, they were able to </tspan><tspan x="0" y="73" class="st1 st2 st11">convert their existing brochure </tspan><tspan x="0" y="94" class="st1 st2 st11">into a nice little website in less </tspan><tspan x="0" y="115" class="st1 st2 st11">than two hours.</tspan></text>
	</g>

		<text transform="matrix(1 0 0 1 682.0054 353)" class="st1 st8 st9">2020.SVIJA.LOVE</text>
		<rect x="619" y="372.976" class="st10" width="239" height="150.407"/>
		<text transform="matrix(1 0 0 1 634 383.6161)"><tspan x="0" y="0" class="st1 st2 st11">The previous Svija website.</tspan><tspan x="0" y="31" class="st1 st2 st11">The idea was to display large </tspan><tspan x="0" y="52" class="st1 st2 st11">format images and show directly </tspan><tspan x="0" y="73" class="st1 st2 st11">from the home page the </tspan><tspan x="0" y="94" class="st1 st2 st11">capabilities of Svija using unique </tspan><tspan x="0" y="115" class="st1 st2 st11">shapes and sophisticated </tspan><tspan x="0" y="136" class="st1 st2 st11">background images.</tspan></text>
	</g>
	<g id="ovaway_x2F_Mnk">

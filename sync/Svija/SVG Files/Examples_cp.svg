		<text transform="matrix(1 0 0 1 385.9854 1749)" class="st1 st8 st9">COLORPOP.SVIJA.LOVE</text>
		<rect x="342" y="1769.034" class="st10" width="239" height="108.406"/>
		<text transform="matrix(1 0 0 1 357 1779.6741)"><tspan x="0" y="0" class="st1 st2 st11">Colorpop was the result of a </tspan><tspan x="0" y="21" class="st1 st2 st11">design exercise by freelancer </tspan><tspan x="0" y="42" class="st1 st2 st11">Eman Akaaboune.</tspan><tspan x="0" y="73" class="st1 st2 st11">We love the rich colors and </tspan><tspan x="0" y="94" class="st1 st2 st11">modern forms!</tspan></text>
	</g>

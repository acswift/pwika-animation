		<path class="st7" d="M299.5,1600.5h-229c-2.761,0-5-2.239-5-5v-489c0-2.761,2.239-5,5-5h229c2.761,0,5,2.239,5,5v489
			C304.5,1598.261,302.261,1600.5,299.5,1600.5z"/>
		<text transform="matrix(1 0 0 1 119.2412 1276)" class="st1 st8 st9">BECKETT.SVIJA.SITE</text>
		<rect x="65.5" y="1295.97" class="st10" width="239" height="171.406"/>
		<text transform="matrix(1 0 0 1 80.5 1306.6102)"><tspan x="0" y="0" class="st1 st2 st11">Le Beckett is a restaurant in Paris </tspan><tspan x="0" y="21" class="st1 st2 st11">that requested a landing page to </tspan><tspan x="0" y="42" class="st1 st2 st11">lead to a simple Wordpress </tspan><tspan x="0" y="63" class="st1 st2 st11">shopping site and a menu </tspan><tspan x="0" y="84" class="st1 st2 st11">maintained in Google Docs.</tspan><tspan x="0" y="115" class="st1 st2 st11">The page was built in a matter of </tspan><tspan x="0" y="136" class="st1 st2 st11">minutes from a PDF flyer </tspan><tspan x="0" y="157" class="st1 st2 st11">provided by the restaurant.</tspan></text>
	</g>
	<g id="ovaway_x2F_Ocp">

		<rect x="619" y="951.97" class="st10" width="239" height="234.406"/>
		<text transform="matrix(1 0 0 1 634 962.6102)"><tspan x="0" y="0" class="st1 st2 st11">Another original Svija client, </tspan><tspan x="0" y="21" class="st1 st2 st11">Atelier Staffeur has received high </tspan><tspan x="0" y="42" class="st1 st2 st11">praise for their website for seven </tspan><tspan x="0" y="63" class="st1 st2 st11">years now.</tspan><tspan x="0" y="94" class="st1 st2 st11">The majestic images and </tspan><tspan x="0" y="115" class="st1 st2 st11">sweeping curves are only possible </tspan><tspan x="0" y="136" class="st1 st2 st11">with Svija.</tspan></text>
	</g>

		<text transform="matrix(1 0 0 1 153.4883 785)" class="st1 st8 st9">MANIK.FR</text>
		<rect x="65.5" y="804.97" class="st10" width="239" height="150.406"/>
		<text transform="matrix(1 0 0 1 80.5 815.6102)"><tspan x="0" y="0" class="st1 st2 st11">One of the first Svija sites, </tspan><tspan x="0" y="21" class="st1 st2 st11">manik.fr was a proof of concept </tspan><tspan x="0" y="42" class="st1 st2 st11">to show that we could provide a </tspan><tspan x="0" y="63" class="st1 st2 st11">high-quality online presence at an </tspan><tspan x="0" y="84" class="st1 st2 st11">affordable budget.</tspan><tspan x="0" y="115" class="st1 st2 st11">Six years later, the site is still </tspan><tspan x="0" y="136" class="st1 st2 st11">flourishing!</tspan></text>
	</g>
	<g id="ovaway_x2F_Ocs">
		<path class="st6" d="M579,1225H344c-1.381,0-2.5-1.119-2.5-2.5v-424c0-1.381,1.119-2.5,2.5-2.5h235c1.381,0,2.5,1.119,2.5,2.5v424

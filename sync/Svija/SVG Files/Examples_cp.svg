		<path class="st7" d="M299.5,606.5h-229c-2.761,0-5-2.239-5-5v-361c0-2.761,2.239-5,5-5h229c2.761,0,5,2.239,5,5v361
			C304.5,604.261,302.261,606.5,299.5,606.5z"/>
		<text transform="matrix(1 0 0 1 146.2524 305)" class="st1 st8 st9">OZAKE.COM</text>
		<rect x="65.5" y="324.976" class="st10" width="239" height="234.407"/>
		<text transform="matrix(1 0 0 1 80.5 335.6161)"><tspan x="0" y="0" class="st1 st2 st11">Svija founder Andrew Swift&apos;s </tspan><tspan x="0" y="21" class="st1 st2 st11">design website. Probably the </tspan><tspan x="0" y="42" class="st1 st2 st11">most elaborate Svija website, it is </tspan><tspan x="0" y="63" class="st1 st2 st11">animated with Svija Vibe — check </tspan><tspan x="0" y="84" class="st1 st2 st11">out the subtle clouds, the </tspan><tspan x="0" y="105" class="st1 st2 st11">buttons, and make sure to </tspan><tspan x="0" y="126" class="st1 st2 st11">mouseover &quot;Antoine de St. </tspan><tspan x="0" y="147" class="st1 st2 st11">Exupery&quot; on the home page.</tspan><tspan x="0" y="178" class="st1 st2 st11">The aim was to exploit large, </tspan><tspan x="0" y="199" class="st1 st2 st11">high-quality images to show the </tspan><tspan x="0" y="220" class="st1 st2 st11">full capability of Svija. </tspan></text>
	</g>
	<g id="ovaway_x2F_Ant">
		<path class="st6" d="M579,755H344c-1.381,0-2.5-1.119-2.5-2.5v-515c0-1.381,1.119-2.5,2.5-2.5h235c1.381,0,2.5,1.119,2.5,2.5v515

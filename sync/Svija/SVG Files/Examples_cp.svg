		<rect x="619" y="1837.864" class="st10" width="239" height="129.406"/>
		<text transform="matrix(1 0 0 1 634 1848.5038)"><tspan x="0" y="0" class="st1 st2 st11">Freelancer Eman Akaaboune&apos;s </tspan><tspan x="0" y="21" class="st1 st2 st11">porfolio site, emanadesign.fr was </tspan><tspan x="0" y="42" class="st1 st2 st11">heavily inspired by ozake.com.</tspan><tspan x="0" y="73" class="st1 st2 st11">Svija enabled the use of </tspan><tspan x="0" y="94" class="st1 st2 st11">richly-detailed background </tspan><tspan x="0" y="115" class="st1 st2 st11">images and brilliant typography.</tspan></text>
	</g>
